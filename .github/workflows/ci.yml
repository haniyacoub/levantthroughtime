# Runs on every push and pull request: validates the data, runs the tests and
# builds the site. Publishing is never automatic: to deploy to GitHub Pages, open
# Actions → CI → "Run workflow" on the main branch and tick "Deploy to GitHub Pages"
# (enable Pages → "GitHub Actions" in the repository settings first).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Elevation tiles are not committed; download once and cache them.
      - name: Cache elevation tiles
        id: tiles
        uses: actions/cache@v6
        with:
          path: public/tiles
          key: terrain-${{ hashFiles('scripts/build-basemap.ts') }}

      - name: Download elevation tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        run: npm run build-basemap -- --tiles-only

      - name: Validate data
        run: npm run validate-data

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves project sites under /<repository-name>/.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npx vite build   # rebuild at the root path for the local test server
          npm run test:e2e
        env:
          CI: true

      - name: Rebuild for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
