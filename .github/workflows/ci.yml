# Runs on every push and pull request: validates the data, runs the tests and
# builds the site. It never publishes anything; publishing is a separate, manual
# workflow (deploy-cloudflare.yml, see README §9).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Elevation tiles are not committed; download once and cache them.
      - name: Cache elevation tiles
        id: tiles
        uses: actions/cache@v6
        with:
          path: public/tiles
          key: terrain-${{ hashFiles('scripts/build-basemap.ts') }}

      - name: Download elevation tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        run: npm run build-basemap -- --tiles-only

      - name: Validate data
        run: npm run validate-data

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true
